name: Build unsigned iOS IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          brew install xcodegen cmake ninja pkg-config
          rustup target add aarch64-apple-ios
      - name: Generate Xcode project
        run: |
          cd pomme-ios
          xcodegen generate
      - name: Prepare Vulkan registry for shaderc
        run: |
          sdk="$(python3 tools/fetch_moltenvk.py ios)"
          mkdir -p "$sdk/share/vulkan/registry"
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/KhronosGroup/Vulkan-Headers/main/registry/vk.xml -o "$sdk/share/vulkan/registry/vk.xml"
      - name: Build app unsigned
        run: |
          xcodebuild -project pomme-ios/Pomme.xcodeproj -scheme Pomme -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/target/ios-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          mkdir -p target/unsigned/Payload
          app="target/ios-build/Build/Products/Release-iphoneos/Pomme.app"
          test -f "$app/pomme-ios" || test -f "$app/Pomme"
          cp -R "$app" target/unsigned/Payload/
          cd target/unsigned
          zip -qry Pomme-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Pomme-unsigned-ipa
          path: target/unsigned/Pomme-unsigned.ipa
          if-no-files-found: error
